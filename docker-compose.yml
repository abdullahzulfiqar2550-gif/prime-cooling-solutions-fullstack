# =============================================================================
# Prime Cooling Solutions — Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f        # View logs
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: primecooling-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-primecooling_db}
      POSTGRES_USER: ${POSTGRES_USER:-primecooling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-primecooling} -d ${POSTGRES_DB:-primecooling_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primecooling-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-primecooling_db}
      POSTGRES_USER: ${POSTGRES_USER:-primecooling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@primecooling.pk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme_admin_password}
      ADMIN_NAME: ${ADMIN_NAME:-Zubair Akeel}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-primecoolingsolutions.pk@gmail.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Prime Cooling Solutions}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ---------------------------------------------------------------------------
  # Next.js Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: primecooling-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WHATSAPP_NUMBER: "923371768618"
      NEXT_PUBLIC_PHONE_NUMBER: "03371768618"
      NEXT_PUBLIC_COMPANY_EMAIL: primecoolingsolutions.pk@gmail.com
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
